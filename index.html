    <!-- Swiper JS -->
    <script src="https://cdn.jsdelivr.net/npm/swiper@12/swiper-bundle.min.js"></script>

    <!-- Initialize Swiper -->
    <script>
        var swiper = new Swiper(".mySwiper", {
            cssMode: true,
            navigation: {
                nextEl: ".swiper-button-next",
                prevEl: ".swiper-button-prev",
            },
            pagination: {
                el: ".swiper-pagination",
            },
            mousewheel: true,
            keyboard: true,
        });


        const noBtn = document.getElementById("noBtn");
        const labBox = document.getElementById("lab");

        noBtn.addEventListener("mouseenter", () => {
            noBtn.style.position = "absolute";
            const parentRect = labBox.getBoundingClientRect();
            console.log(parentRect)
            const btnRect = noBtn.getBoundingClientRect();

            const maxX = parentRect.width - btnRect.width;
            const maxY = parentRect.height - btnRect.height;

            // Random X and Y inside container
            const randomX = Math.floor(Math.random() * maxX);
            const randomY = Math.floor(Math.random() * maxY);

            noBtn.style.left = randomX + "px";
            noBtn.style.top = randomY + "px";
        });
    </script>
