<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        html,
        body {
            padding: 0;
            margin: 0;
            height: 100dvh;
            background-color: black;
            overflow: hidden;
        }

        .container {
            height: 100%;
        }

        .box {
            width: 200px;
            height: 80px;
            border-radius: 50%;
            background-color: aqua;
            will-change: transform;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="box"></div>
    </div>

    <script src="
https://cdn.jsdelivr.net/npm/lodash@4.18.1/lodash.min.js
"></script>

    <script>

        const box = document.querySelector(".box");
        const boxRect = box.getBoundingClientRect();

        let x = 0;
        let y = 0;

        let dx = _.random(-0.5, 0.5, true);
        let dy = _.random(-0.5, 0.5, true);

        function generateRandomColor() {
            let colorR = _.random(0, 255);
            let colorG = _.random(0, 255);
            let colorB = _.random(0, 255);
            box.style.backgroundColor = `rgb(${colorR}, ${colorB}, ${colorG})`;
        }

        let lastTime = 0;
        function animate(currentTime) {
            if (!lastTime) lastTime = currentTime;
            const deltaTime = currentTime - lastTime;
            lastTime = currentTime;

            if ((x + boxRect.width) >= window.innerWidth || x < 0) {
                dx = -dx;
                generateRandomColor();
            }
            if ((y + boxRect.height) >= window.innerHeight || y < 0) {
                dy = -dy;
                generateRandomColor();
            }
            x = x + dx * deltaTime;
            y = y + dy * deltaTime;
            box.style.transform = `translate3d(${x}px, ${y}px, 0)`;
            requestAnimationFrame(animate);
        }
        generateRandomColor();
        requestAnimationFrame(animate);
    </script>
</body>

</html>
